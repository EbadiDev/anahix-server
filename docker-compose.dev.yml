version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: anahix-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: anahix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anahix_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - anahix-dev-net

  redis:
    image: redis:7-alpine
    container_name: anahix-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - anahix-dev-net

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  anahix-dev-net:
    driver: bridge
